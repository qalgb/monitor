<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b2b">
  <title>美股七巨头 · 年初至今</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f6fa; color: #17263b; }
    header { background: #101b2b; color: #fff; padding: 44px max(22px, calc((100vw - 840px)/2)) 58px; }
    .eyebrow { color: #9bd6cb; font-size: 13px; letter-spacing: .16em; font-weight: 700; }
    h1 { font-size: clamp(28px, 6vw, 42px); margin: 12px 0 10px; line-height: 1.2; }
    header p { color: #b9c6d7; margin: 0; line-height: 1.6; }
    main { max-width: 884px; padding: 0 22px 40px; margin: -28px auto 0; }
    .summary, .card { background: #fff; border: 1px solid #e3eaf1; border-radius: 18px; box-shadow: 0 8px 28px #1020300a; }
    .summary { padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    .label { color: #64738a; font-size: 13px; }
    .date { font-size: 22px; font-weight: 750; margin-top: 3px; }
    button { cursor: pointer; background: #e6f4f1; color: #08685c; border: 0; border-radius: 10px; padding: 11px 18px; font-size: 14px; font-weight: 700; }
    button:hover { background: #d2ede7; }
    #status { min-height: 22px; margin: 18px 2px; color: #66768b; font-size: 14px; }
    #status.error { color: #b3343a; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .card { padding: 22px; }
    .card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .company { font-size: 18px; font-weight: 750; }
    .ticker { color: #66768b; font-size: 13px; font-weight: 700; }
    .percent { font-variant-numeric: tabular-nums; font-size: 32px; font-weight: 750; margin: 21px 0 14px; letter-spacing: -.03em; }
    .up { color: #087760; } .down { color: #c43d48; } .flat { color: #66768b; }
    .prices { color: #64738a; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px; font-size: 13px; }
    footer { margin-top: 28px; color: #63738a; line-height: 1.7; font-size: 13px; }
    @media (max-width: 580px) {
      header { padding-top: 36px; padding-bottom: 54px; }
      .grid { grid-template-columns: 1fr; }
      .card { padding: 19px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">MAGNIFICENT SEVEN</div>
    <h1>美股七巨头 · 年初至今</h1>
    <p>从上年最后一个交易日收盘价起算，追踪七家公司的股价表现。</p>
  </header>
  <main>
    <div class="summary">
      <div><div class="label">美股收盘日期</div><div class="date" id="date">等待数据</div></div>
      <button id="refresh" type="button">刷新数据</button>
    </div>
    <div id="status" role="status" aria-live="polite">正在获取收盘数据…</div>
    <div class="grid" id="stocks"></div>
    <footer id="footnote">按美股交易日收盘价更新；非实时行情，不构成投资建议。</footer>
  </main>
  <script>
    const status = document.getElementById("status");
    const stocks = document.getElementById("stocks");
    const footnote = document.getElementById("footnote");

    async function load() {
      status.className = "";
      status.textContent = "正在获取收盘数据…";
      try {
        const response = await fetch(`data.json?t=${Date.now()}`, {cache: "no-store"});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (!data.as_of || !Array.isArray(data.stocks) || data.stocks.length !== 7) {
          throw new Error("数据不完整");
        }
        document.getElementById("date").textContent = data.as_of;
        stocks.replaceChildren();
        for (const item of data.stocks) {
          const card = document.createElement("article");
          card.className = "card";
          const top = document.createElement("div");
          top.className = "card-top";
          const name = document.createElement("span");
          name.className = "company";
          name.textContent = item.name;
          const ticker = document.createElement("span");
          ticker.className = "ticker";
          ticker.textContent = item.ticker;
          top.append(name, ticker);
          const percent = document.createElement("div");
          percent.className = `percent ${item.ytd_pct > 0 ? "up" : item.ytd_pct < 0 ? "down" : "flat"}`;
          percent.textContent = `${item.ytd_pct > 0 ? "+" : ""}${item.ytd_pct.toFixed(2)}%`;
          const prices = document.createElement("div");
          prices.className = "prices";
          const close = document.createElement("span");
          close.textContent = `收盘 $${item.close.toFixed(2)}`;
          const base = document.createElement("span");
          base.textContent = `基准 $${item.base_close.toFixed(2)}`;
          prices.append(close, base);
          card.append(top, percent, prices);
          stocks.append(card);
        }
        status.textContent = `按涨幅排序 · 数据来源：${data.source}`;
        footnote.textContent = `基准日：${data.stocks[0].base_date}（上年最后交易日）。价格涨跌幅不含股息；非实时行情，不构成投资建议。`;
      } catch (error) {
        status.className = "error";
        status.textContent = `暂时无法获取完整行情：${error.message}。请稍后刷新。`;
      }
    }
    document.getElementById("refresh").addEventListener("click", load);
    load();
  </script>
</body>
</html>
